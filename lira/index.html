<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lira-Rechner</title>
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{--bg:#0f172a;--card:#1e293b;--line:#334155;--txt:#f1f5f9;--mut:#94a3b8;--acc:#e11d48;--ok:#22c55e;--warn:#f59e0b}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
       min-height:100vh;padding:max(16px,env(safe-area-inset-top)) 16px 24px}
  .wrap{max-width:440px;margin:0 auto}
  h1{font-size:20px;margin:4px 0 16px;display:flex;align-items:center;gap:8px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
  label{display:block;font-size:13px;color:var(--mut);margin-bottom:6px}
  .field{display:flex;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:4px 14px}
  .field input{flex:1;background:none;border:0;color:var(--txt);font-size:30px;font-weight:600;padding:10px 0;width:100%;outline:none}
  .field span{font-size:18px;font-weight:700;color:var(--mut)}
  .swap{display:block;margin:10px auto;background:var(--acc);color:#fff;border:0;border-radius:50%;width:46px;height:46px;font-size:22px;cursor:pointer}
  .rate{font-size:15px;line-height:1.5}
  .rate b{font-size:17px}
  .status{display:inline-block;font-size:12px;padding:3px 9px;border-radius:99px;margin-top:6px}
  .on{background:#14532d;color:#bbf7d0}.off{background:#78350f;color:#fde68a}.man{background:#1e3a8a;color:#bfdbfe}
  .btns{display:flex;gap:8px;margin-top:12px}
  .btn{flex:1;background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:11px;font-size:14px;cursor:pointer}
  .quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .quick button{background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px 0;font-size:14px;cursor:pointer}
  .row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}
  .row:last-child{border:0}
  .manual{display:none;margin-top:12px}
  .manual input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--txt);font-size:17px;padding:10px}
  small{color:var(--mut)}
</style>
</head>
<body>
<div class="wrap">
  <h1>🇹🇷 ⇄ 🇪🇺 Lira-Rechner</h1>

  <div class="card">
    <label id="lblA">Türkische Lira</label>
    <div class="field"><input id="a" type="text" inputmode="decimal" placeholder="0"><span id="curA">TRY</span></div>
    <button class="swap" id="swap" aria-label="Richtung tauschen">⇅</button>
    <label id="lblB">Euro</label>
    <div class="field"><input id="b" type="text" inputmode="decimal" placeholder="0"><span id="curB">EUR</span></div>
  </div>

  <div class="card">
    <div class="rate" id="rateTxt">Noch kein Kurs gespeichert.</div>
    <span class="status" id="status"></span>
    <div class="btns">
      <button class="btn" id="refresh">↻ Kurs aktualisieren</button>
      <button class="btn" id="manBtn">✎ Kurs selbst eingeben</button>
    </div>
    <div class="manual" id="manual">
      <label>1 EUR = … TRY</label>
      <input id="manIn" type="text" inputmode="decimal" placeholder="z. B. 48,50">
      <div class="btns"><button class="btn" id="manSave">Speichern</button><button class="btn" id="manAuto">Wieder automatisch</button></div>
    </div>
  </div>

  <div class="card">
    <label>Schnell-Tabelle</label>
    <div class="quick" id="quick"></div>
    <div id="table" style="margin-top:10px"></div>
  </div>

  <small>Kurs: Europäische Zentralbank (über frankfurter.app). Offline wird der zuletzt gespeicherte Kurs verwendet.</small>
</div>

<script>
const K='liraRechner';
let st={rate:null,date:null,fetched:null,manual:false,dir:'TRY-EUR'};
try{Object.assign(st,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(st))}catch(e){}};
const $=id=>document.getElementById(id);
const num=s=>{s=String(s).trim().replace(/\s/g,'');if(s.includes(',')){s=s.replace(/\./g,'').replace(',','.')}return parseFloat(s)};
const fmt=(n,d=2)=>isFinite(n)?n.toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d}):'';

function render(){
  const tryFirst=st.dir==='TRY-EUR';
  $('lblA').textContent=tryFirst?'Türkische Lira':'Euro';
  $('lblB').textContent=tryFirst?'Euro':'Türkische Lira';
  $('curA').textContent=tryFirst?'TRY':'EUR';
  $('curB').textContent=tryFirst?'EUR':'TRY';
  if(st.rate){
    $('rateTxt').innerHTML=`1 EUR = <b>${fmt(st.rate,4)} TRY</b><br>1 TRY = <b>${fmt(1/st.rate,4)} EUR</b><br><small>Stand: ${st.manual?'manuell eingegeben':st.date?new Date(st.date).toLocaleDateString('de-DE'):''}${st.fetched?' · geladen '+new Date(st.fetched).toLocaleString('de-DE',{dateStyle:'short',timeStyle:'short'}):''}</small>`;
  }
  const s=$('status');
  if(st.manual){s.className='status man';s.textContent='Manueller Kurs'}
  else if(!navigator.onLine){s.className='status off';s.textContent='Offline – letzter Kurs'}
  else if(st.rate){s.className='status on';s.textContent='Online'}
  else s.textContent='';
  const q=tryFirst?[100,500,1000,5000]:[10,50,100,500];
  $('quick').innerHTML=q.map(v=>`<button data-v="${v}">${v.toLocaleString('de-DE')}</button>`).join('');
  $('table').innerHTML=st.rate?q.map(v=>`<div class="row"><span>${v.toLocaleString('de-DE')} ${tryFirst?'TRY':'EUR'}</span><b>${fmt(tryFirst?v/st.rate:v*st.rate)} ${tryFirst?'EUR':'TRY'}</b></div>`).join(''):'';
  calc('a');
}
function calc(from){
  if(!st.rate)return;
  const tryFirst=st.dir==='TRY-EUR';
  const f=v=>tryFirst?v/st.rate:v*st.rate, r=v=>tryFirst?v*st.rate:v/st.rate;
  if(from==='a'){const v=num($('a').value);$('b').value=isFinite(v)?fmt(f(v)):''}
  else{const v=num($('b').value);$('a').value=isFinite(v)?fmt(r(v)):''}
}
async function load(force){
  if(st.manual&&!force)return render();
  if(!navigator.onLine)return render();
  try{
    let rate,date;
    try{
      const r=await fetch('https://api.frankfurter.app/latest?from=EUR&to=TRY',{cache:'no-store'});
      const j=await r.json();rate=j.rates.TRY;date=j.date;
    }catch(e){
      const r=await fetch('https://open.er-api.com/v6/latest/EUR',{cache:'no-store'});
      const j=await r.json();rate=j.rates.TRY;date=new Date(j.time_last_update_unix*1000).toISOString();
    }
    if(rate){st.rate=rate;st.date=date;st.fetched=Date.now();st.manual=false;save()}
  }catch(e){}
  render();
}
$('a').addEventListener('input',()=>calc('a'));
$('b').addEventListener('input',()=>calc('b'));
$('swap').onclick=()=>{st.dir=st.dir==='TRY-EUR'?'EUR-TRY':'TRY-EUR';const v=$('b').value;save();render();$('a').value=v;calc('a')};
$('quick').onclick=e=>{const v=e.target.dataset.v;if(v){$('a').value=v;calc('a')}};
$('refresh').onclick=()=>{st.manual=false;load(true)};
$('manBtn').onclick=()=>{const m=$('manual');m.style.display=m.style.display==='block'?'none':'block';if(st.rate)$('manIn').value=fmt(st.rate,4)};
$('manSave').onclick=()=>{const v=num($('manIn').value);if(v>0){st.rate=v;st.manual=true;st.fetched=null;save();$('manual').style.display='none';render()}};
$('manAuto').onclick=()=>{st.manual=false;$('manual').style.display='none';load(true)};
addEventListener('online',()=>load());addEventListener('offline',render);
render();load();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
