<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d6b6e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192-1.png">
<link rel="apple-touch-icon" href="icon-192-1.png">
<title>Stempeluhr</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one-column punch-clock app; the clock card is the hero, period report below, sheets slide up from the bottom. */
:root{
  --bg:#eef1f3; --card:#ffffff; --ink:#18242b; --muted:#5b6b74; --line:#d5dde1;
  --accent:#0d6b6e; --accent-ink:#ffffff; --run:#c77a0a; --run-soft:#fbefd9; --danger:#b3261e; --soft:#e3eaed;
  --j0:#0d6b6e; --j1:#c77a0a; --j2:#5a4fcf; --j3:#2f8a3e; --j4:#b8436b; --j5:#3a6fb0;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1619; --card:#172126; --ink:#e3eaed; --muted:#93a4ad; --line:#2a3840;
  --accent:#3fb3b3; --accent-ink:#06191a; --run:#f0a63a; --run-soft:#33280f; --danger:#f2867d; --soft:#1f2c32;
  --j0:#3fb3b3; --j1:#f0a63a; --j2:#9a91ff; --j3:#62c374; --j4:#ec7ea3; --j5:#79a8e6;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1619; --card:#172126; --ink:#e3eaed; --muted:#93a4ad; --line:#2a3840;
  --accent:#3fb3b3; --accent-ink:#06191a; --run:#f0a63a; --run-soft:#33280f; --danger:#f2867d; --soft:#1f2c32;
  --j0:#3fb3b3; --j1:#f0a63a; --j2:#9a91ff; --j3:#62c374; --j4:#ec7ea3; --j5:#79a8e6;
  color-scheme:dark}

*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
body{margin:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

header{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
header h1{font-family:var(--f-display);font-weight:700;font-size:28px;letter-spacing:.02em;text-transform:uppercase;margin:0}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--j3)}

/* clock card */
.clock{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:16px;position:relative;overflow:hidden}
.clock.running{border-color:var(--run)}
.clock.running::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:var(--run)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 13px;display:flex;align-items:center;gap:7px;font-weight:500;font-size:14px}
.chip .dot{width:9px;height:9px;border-radius:50%}
.chip[aria-pressed="true"]{background:var(--soft);border-color:var(--ink)}
.chip:disabled{opacity:.45;cursor:default}
.face{display:flex;flex-direction:column;align-items:center;gap:4px;padding-block:6px}
.timer{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600;font-size:clamp(46px,15vw,72px);letter-spacing:-.02em;line-height:1}
.timer .s{color:var(--muted);font-size:.5em;margin-left:2px}
.status{font-size:13px;color:var(--muted);text-align:center;min-height:1.4em}
.status b{color:var(--ink);font-weight:600}
.paused .timer{color:var(--muted)}
.soll-line{font-size:13px;text-align:center;background:var(--soft);border-radius:8px;padding:7px 12px;margin-top:6px;line-height:1.5}
.okc{color:var(--j3);font-weight:600}
.alarms{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.alarms a,.alarms button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:500;text-decoration:none}
.alarms .num{font-weight:600}
.alarms .bell{border-color:var(--accent);color:var(--accent)}
.warnbar{background:var(--run-soft);border:1px solid var(--run);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:14px;text-align:center}
.hintc{color:var(--muted);font-size:12px}
.soll{display:flex;flex-direction:column;gap:8px}
.sollrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.sollrow .h{grid-column:1/-1;display:flex;align-items:center;gap:7px;font-weight:600;font-size:14px}
.sollrow .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sollrow .v{font-family:var(--f-mono);font-weight:600;font-variant-numeric:tabular-nums;font-size:16px}
.pos{color:var(--j3)} .neg{color:var(--danger)}
.jobcard{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px}
.jobcard .r1{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.jobcard .r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.jobcard input[type=text],.jobcard input[type=number]{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;min-width:0;width:100%}
.jobcard .mini{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:flex;flex-direction:column;gap:3px}
.check{display:flex;align-items:center;gap:8px;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.label-up{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.actions{display:grid;grid-template-columns:1fr;gap:10px}
.actions.two{grid-template-columns:1fr 1fr}
.btn-big{border:0;border-radius:12px;padding:18px 12px;font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.08em;text-transform:uppercase}
.btn-start{background:var(--accent);color:var(--accent-ink)}
.btn-stop{background:var(--run);color:#1b1205}
.btn-pause{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.note{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:14px}

/* toolbar */
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tbtn{flex:1 1 auto;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;font-weight:500;font-size:14px;white-space:nowrap}

/* report */
.report{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:16px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--soft);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;border-radius:8px;padding:8px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav button{border:1px solid var(--line);background:transparent;border-radius:8px;width:40px;height:36px;font-size:18px}
.nav h2{font-family:var(--f-display);font-weight:600;font-size:21px;margin:0;text-align:center;text-wrap:balance}
.total{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px}
.total .big{font-family:var(--f-mono);font-weight:600;font-size:34px;font-variant-numeric:tabular-nums}
.total .side{font-size:13px;color:var(--muted);text-align:right}
.byjob{display:flex;flex-direction:column;gap:9px}
.jrow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.jrow .n{display:flex;align-items:center;gap:7px;font-weight:500;min-width:0}
.jrow .n span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jrow .v{font-family:var(--f-mono);font-size:14px;font-variant-numeric:tabular-nums;text-align:right}
.jrow .v small{color:var(--muted);font-family:var(--f-body);margin-left:6px}
.jrow .bar{grid-column:1/-1;height:6px;background:var(--soft);border-radius:3px;overflow:hidden}
.jrow .bar i{display:block;height:100%;border-radius:3px}
.dot{width:9px;height:9px;border-radius:50%;flex:none}

.chart{display:flex;flex-direction:column;gap:6px}
.chart .plot{display:flex;align-items:flex-end;gap:3px;height:120px;border-bottom:1px solid var(--line);position:relative}
.chart .grid{position:absolute;inset:0;pointer-events:none}
.chart .grid div{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
.chart .grid span{position:absolute;right:0;transform:translateY(-100%);font-size:10px;color:var(--muted);font-family:var(--f-mono)}
.chart .col{flex:1 1 0;display:flex;flex-direction:column-reverse;min-width:0;height:100%;position:relative;z-index:1}
.chart .col i{display:block;width:100%}
.chart .col i:last-child{border-radius:3px 3px 0 0}
.chart .col.today::after{content:"";position:absolute;bottom:-5px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--ink)}
.chart .xl{display:flex;gap:3px;font-size:10px;color:var(--muted);font-family:var(--f-mono)}
.chart .xl span{flex:1 1 0;text-align:center;min-width:0;overflow:hidden}

.days{display:flex;flex-direction:column;gap:14px}
.day h3{margin:0 0 6px;display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.day h3 .num{color:var(--ink);text-transform:none;letter-spacing:0}
.entry{width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center;text-align:left;background:transparent;border:0;border-top:1px solid var(--line);padding:10px 2px}
.entry:first-of-type{border-top:0}
.entry .t{font-family:var(--f-mono);font-size:14px;font-variant-numeric:tabular-nums}
.entry .j{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry .d{font-family:var(--f-mono);font-weight:600;font-variant-numeric:tabular-nums}
.entry .meta{grid-column:2/-1;font-size:12px;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.entry.live{background:var(--run-soft);border-radius:8px;padding-inline:8px}
.empty{color:var(--muted);text-align:center;padding:22px 8px;border:1px dashed var(--line);border-radius:10px;font-size:14px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(8,14,17,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:16px 16px 0 0;max-height:88%;overflow:auto;
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet h2{font-family:var(--f-display);font-weight:700;font-size:24px;margin:0;text-transform:uppercase;letter-spacing:.04em}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px;width:100%;min-width:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.sheet-actions{display:flex;gap:10px;flex-wrap:wrap}
.sbtn{flex:1 1 120px;border-radius:10px;padding:12px;font-weight:600;border:1px solid var(--line);background:transparent}
.sbtn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sbtn.danger{color:var(--danger);border-color:var(--danger)}
.sbtn.danger.armed{background:var(--danger);color:var(--card)}
.err{color:var(--danger);font-size:13px;min-height:1.2em}
.jobedit{display:grid;grid-template-columns:auto 1fr 84px auto;gap:8px;align-items:center}
.jobedit input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;min-width:0;width:100%}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line)}
.iconbtn{border:1px solid var(--line);background:transparent;border-radius:8px;width:36px;height:36px}
.hint{font-size:12px;color:var(--muted)}
textarea.out{width:100%;height:160px;font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
  .clock.running:not(.paused) .colon{animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:.25}}
}
@media (max-width:380px){.jobedit{grid-template-columns:auto 1fr 70px auto}.row3{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>


<div class="wrap">
  <header>
    <h1>Stempeluhr</h1>
    
  </header>

  <section class="clock" id="clock" aria-label="Zeiterfassung">
    <div>
      <div class="label-up" style="margin-bottom:8px">Job</div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="face">
      <div class="timer" id="timer" aria-live="off">0<span class="colon">:</span>00<span class="s">:00</span></div>
      <div class="status" id="status">Bereit zum Einstempeln</div>
      <div class="soll-line" id="sollLine" hidden></div>
    </div>
    <div class="warnbar" id="warnbar" hidden></div>
    <div class="alarms" id="alarms" hidden></div>
    <input class="note" id="note" placeholder="Notiz (optional), z. B. Inventur, Hochzeit Saal 2" maxlength="140">
    <div class="actions" id="actions"></div>
  </section>

  <div class="tools">
    <button class="tbtn" id="btnAdd">+ Nachtragen</button>
    <button class="tbtn" id="btnExport">Export CSV</button>
    <button class="tbtn" id="btnJobs">Jobs</button>
  </div>

  <section class="report" aria-label="Übersicht">
    <div class="seg" role="tablist">
      <button role="tab" data-v="day">Tag</button>
      <button role="tab" data-v="week">Woche</button>
      <button role="tab" data-v="month">Monat</button>
    </div>
    <div class="nav">
      <button id="prev" aria-label="Zurück">‹</button>
      <h2 id="ptitle"></h2>
      <button id="next" aria-label="Weiter">›</button>
    </div>
    <div class="total">
      <div><div class="label-up">Arbeitszeit</div><div class="big" id="tot">0:00</div></div>
      <div class="side" id="totside"></div>
    </div>
    <div class="byjob" id="byjob"></div>
    <div class="soll" id="soll"></div>
    <div class="chart" id="chart"></div>
    <div class="days" id="days"></div>
  </section>
</div>

<div id="sheetRoot"></div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
const COLORS = 6;
const DEFAULT_JOBS = [
  {id:"j_wiesenhof", name:"Wiesenhof", color:0, rate:0, target:41},
  {id:"j_kellnern", name:"Kellnern", color:1, rate:0, target:0},
  {id:"j_tecis", name:"tecis", color:2, rate:0, target:0}
];
const S = { jobs: DEFAULT_JOBS.map(j=>({...j})), running:null, months:{}, sel: DEFAULT_JOBS[0].id };
const UI = { view:"week", anchor:new Date() };

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,"0");
const WD = ["So","Mo","Di","Mi","Do","Fr","Sa"];
const WDL = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
const MON = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const monKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
const hm = t => { const d=new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fmtHM = ms => { const m=Math.max(0,Math.round(ms/60000)); return `${Math.floor(m/60)}:${pad(m%60)}`; };
const fmtDec = ms => (Math.max(0,ms)/3600000).toLocaleString("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2});
const eur = v => v.toLocaleString("de-DE",{style:"currency",currency:"EUR"});
const sod = d => new Date(d.getFullYear(),d.getMonth(),d.getDate());
const addDays = (d,n) => new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const sow = d => { const x=sod(d); return addDays(x, -((x.getDay()+6)%7)); };
const jobById = id => S.jobs.find(j=>j.id===id) || {id, name:"Gelöschter Job", color:5, rate:0};
const jc = j => `var(--j${(j.color||0)%COLORS})`;
const uid = () => Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pauseMs = (pauses, now) => (pauses||[]).reduce((a,p)=>a+((p.e??now)-p.s),0);
const H=3600000, MIN=60000;
/* Pausen zählen nur, wenn sie per Pause-Knopf gestempelt oder beim Nachtragen eingegeben wurden. */
const ePause = e => e.pause||0;
const net = e => e.end - e.start - ePause(e);
const dailyTarget = j => (j.target||0)/5*H;
const isWorkday = d => d.getDay()>=1 && d.getDay()<=5;
function targetIn(j,a,b,untilToday){ const lim=untilToday?addDays(sod(new Date()),1):b; let n=0; for(let d=new Date(a); d<b && d<lim; d=addDays(d,1)) if(isWorkday(d)) n++; return n*dailyTarget(j); }
const signed = ms => (ms<0?"−":"+")+fmtHM(Math.abs(ms));
function normalizeJobs(){ S.jobs=S.jobs.map(j=>({...j,
  target: j.target!==undefined ? j.target : (j.id==="j_wiesenhof"?41:0) })); }
function isoWeek(d){ const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const day=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-day); const y=new Date(Date.UTC(t.getUTCFullYear(),0,1)); return Math.ceil(((t-y)/86400000+1)/7); }

function toast(msg){ const t=$("toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2600); }

/* ---------- storage: synced db, fallback local ---------- */
const store = { mode:"none", db:null, uid:null, pend:{}, q:{} };
const LS = "stempeluhr.v1";
function lsLoad(){ try{ const raw=localStorage.getItem(LS); if(!raw) return; const d=JSON.parse(raw); if(d.jobs?.length) S.jobs=d.jobs; S.running=d.running||null; S.months=d.months||{}; if(d.sel) S.sel=d.sel; normalizeJobs(); }catch(e){} }
function lsSave(){ try{ localStorage.setItem(LS, JSON.stringify({jobs:S.jobs,running:S.running,months:S.months,sel:S.sel})); }catch(e){} }
function base(){ return "data/users/"+store.uid; }
function write(path, data){
  if(store.mode!=="db"){ lsSave(); return; }
  store.pend[path]=(store.pend[path]||0)+1;
  store.q[path]=(store.q[path]||Promise.resolve()).then(()=>store.db.doc(path).set(data)).catch(err=>{
    if(err?.code==="quota_exceeded") toast("Speicher voll. Bitte alte Einträge löschen.");
    else toast("Speichern fehlgeschlagen. Bitte erneut versuchen.");
  }).finally(()=>{ store.pend[path]--; });
  lsSave();
}
function saveSettings(){ write(base()+"/settings", {jobs:S.jobs, running:S.running, sel:S.sel}); }
function saveMonth(k){ write(base()+"/m-"+k, {entries:S.months[k]||[]}); }


function initStore(){
  lsLoad(); render();
  try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
}
function safeGet(){ try{ return localStorage.getItem(LS); }catch(e){ return null; } }

/* ---------- clock actions ---------- */
function start(){
  S.running={job:S.sel, start:Date.now(), pauses:[], note:$("note").value.trim()};
  saveSettings(); render(); toast("Eingestempelt");
  askNotify();
}
function togglePause(){
  const r=S.running; if(!r) return;
  const last=r.pauses[r.pauses.length-1];
  if(last && last.e==null){ last.e=Date.now(); toast("Weiter geht’s"); }
  else { r.pauses.push({s:Date.now(), e:null}); toast("Pause gestartet"); }
  saveSettings(); render();
}
function stop(){
  const r=S.running; if(!r) return;
  const now=Date.now();
  const e={id:uid(), job:r.job, start:r.start, end:now, pause:pauseMs(r.pauses,now), note:($("note").value.trim()||r.note||"")};
  const k=monKey(new Date(e.start));
  (S.months[k] ||= []).push(e);
  S.running=null; $("note").value="";
  saveMonth(k); saveSettings(); render();
  toast(`Ausgestempelt · ${fmtHM(net(e))} h`);
}

/* ---------- data queries ---------- */
function entriesIn(a,b){
  const out=[]; const keys=new Set();
  for(let d=new Date(a.getFullYear(),a.getMonth()-1,1); d<b; d=new Date(d.getFullYear(),d.getMonth()+1,1)) keys.add(monKey(d));
  for(const k of keys) for(const e of (S.months[k]||[])) if(e.start>=+a && e.start<+b) out.push(e);
  return out.sort((x,y)=>x.start-y.start);
}
function liveEntry(){
  const r=S.running; if(!r) return null; const now=Date.now();
  return {id:"live", live:true, job:r.job, start:r.start, end:now, pause:pauseMs(r.pauses,now), note:r.note};
}
function range(){
  const a=UI.anchor;
  if(UI.view==="day"){ const s=sod(a); return [s, addDays(s,1)]; }
  if(UI.view==="week"){ const s=sow(a); return [s, addDays(s,7)]; }
  const s=new Date(a.getFullYear(),a.getMonth(),1); return [s, new Date(a.getFullYear(),a.getMonth()+1,1)];
}

/* ---------- render ---------- */
function render(){ renderClock(); renderReport(); }

function renderClock(){
  const r=S.running, now=Date.now();
  const paused = r && r.pauses.length && r.pauses[r.pauses.length-1].e==null;
  $("clock").classList.toggle("running",!!r);
  $("clock").classList.toggle("paused",!!paused);
  $("chips").innerHTML = S.jobs.map(j=>`<button class="chip" data-job="${esc(j.id)}" aria-pressed="${(r?r.job:S.sel)===j.id}" ${r?"disabled":""}><span class="dot" style="background:${jc(j)}"></span>${esc(j.name)}</button>`).join("");
  if(r && document.activeElement!==$("note") && !$("note").value) $("note").value=r.note||"";
  const a=$("actions");
  if(!r){ a.className="actions"; a.innerHTML=`<button class="btn-big btn-start" id="bStart">Start</button>`; }
  else { a.className="actions two"; a.innerHTML=`<button class="btn-big btn-pause" id="bPause">${paused?"Weiter":"Pause"}</button><button class="btn-big btn-stop" id="bStop">Stopp</button>`; }
  tick(); renderAlarms();
}
function tick(){
  const r=S.running, now=Date.now();
  let ms=0, st="Bereit zum Einstempeln";
  if(r){
    ms=net(liveEntry());
    const p=pauseMs(r.pauses,now);
    const paused=r.pauses.length && r.pauses[r.pauses.length-1].e==null;
    st=`${paused?"Pause seit "+hm(r.pauses[r.pauses.length-1].s)+" · ":""}<b>${esc(jobById(r.job).name)}</b> seit ${hm(r.start)}${new Date(r.start).toDateString()!==new Date().toDateString()?" ("+WD[new Date(r.start).getDay()]+")":""}${p>=60000?` · Pause ${fmtHM(p)}`:""}`;
  } else {
    const t=entriesIn(sod(new Date()), addDays(sod(new Date()),1)).reduce((s,e)=>s+net(e),0);
    if(t>0) st=`Heute bisher <b>${fmtHM(t)} h</b>`;
  }
  const s=Math.floor(Math.max(0,ms)/1000);
  $("timer").innerHTML=`${Math.floor(s/3600)}<span class="colon">:</span>${pad(Math.floor(s/60)%60)}<span class="s">:${pad(s%60)}</span>`;
  $("status").innerHTML=st;
  sollLine();
  checkReminders();
}
function sollLine(){
  const el=$("sollLine"), r=S.running, j=jobById(r?r.job:S.sel), today=sod(new Date());
  const T=dailyTarget(j);
  if(!T || !isWorkday(today)){ el.hidden=true; return; }
  const done=entriesIn(today,addDays(today,1)).filter(e=>e.job===j.id).reduce((s,e)=>s+net(e),0);
  const live=r?liveEntry():null, liveNet=live?net(live):0;
  const rest=T-done-liveNet;
  let txt=`Soll heute <b class="num">${fmtHM(T)}</b> · `;
  if(rest<=0) txt+=`<span class="okc">Soll erfüllt <b class="num">${signed(-rest)}</b></span>`;
  else {
    txt+=`noch <b class="num">${fmtHM(rest)}</b>`;
    const paused=r && r.pauses.length && r.pauses[r.pauses.length-1].e==null;
    if(r && !paused){
      txt+=` · Feierabend ca. <b class="num">${hm(Date.now()+rest)}</b>`;
    }
  }
  el.innerHTML=txt; el.hidden=false;
}

/* ---------- Erinnerungen ---------- */
const LEAD=15*MIN, MAXDAY=10*H;
function todayNet(filterJob){
  const t=sod(new Date());
  let ms=entriesIn(t,addDays(t,1)).filter(e=>!filterJob||e.job===filterJob).reduce((s,e)=>s+net(e),0);
  const live=liveEntry(); if(live && (!filterJob||live.job===filterJob)) ms+=net(live);
  return ms;
}
// verbleibende Netto-Zeit bis Soll bzw. 10 h (null = kein Ziel)
function remaining(){
  const r=S.running; if(!r) return {};
  const j=jobById(r.job), T=dailyTarget(j);
  return {
    soll: T && isWorkday(new Date()) ? T-todayNet(j.id) : null,
    max: MAXDAY-todayNet(null), job:j, T
  };
}
function notifyPerm(){ return ("Notification" in window) ? Notification.permission : "unsupported"; }
function askNotify(){
  if(notifyPerm()!=="default") return;
  try{ Notification.requestPermission().then(()=>renderAlarms()); }catch(e){}
}
async function notify(title, body, tag){
  toast(title); showWarn(`<b>${esc(title)}</b><br>${esc(body)}`);
  try{ navigator.vibrate && navigator.vibrate([250,120,250]); }catch(e){}
  if(notifyPerm()!=="granted") return;
  const opt={body, tag, icon:"icon-192-1.png", badge:"icon-192-1.png", vibrate:[250,120,250], renotify:true, requireInteraction:true};
  try{ const reg=await navigator.serviceWorker?.ready; if(reg){ await reg.showNotification(title,opt); return; } }catch(e){}
  try{ new Notification(title,opt); }catch(e){}
}
function showWarn(html){ const w=$("warnbar"); w.innerHTML=html; w.hidden=false; clearTimeout(showWarn._t); showWarn._t=setTimeout(()=>w.hidden=true, 15*MIN); }
function checkReminders(){
  const r=S.running; if(!r) return;
  r.notified ||= {};
  const paused=r.pauses.length && r.pauses[r.pauses.length-1].e==null;
  const {soll,max,T}=remaining();
  let changed=false;
  if(soll!=null && !r.notified.soll){
    if(soll<=0){ r.notified.soll=true; changed=true; }                       // schon erreicht beim Öffnen
    else if(soll<=LEAD && !paused){ r.notified.soll=true; changed=true;
      notify(`Noch ${Math.ceil(soll/MIN)} Minuten bis ${fmtHM(T)} h`, `Um ${hm(Date.now()+soll)} hast du dein Tagessoll erreicht.`, "soll"); }
  }
  if(!r.notified.max){
    if(max<=0){ r.notified.max=true; changed=true; }
    else if(max<=LEAD && !paused){ r.notified.max=true; changed=true;
      notify(`Noch ${Math.ceil(max/MIN)} Minuten bis 10 Stunden`, `Um ${hm(Date.now()+max)} erreichst du die gesetzliche Höchstarbeitszeit von 10 Stunden.`, "max"); }
  }
  if(changed) saveSettings();
}
// Android-Wecker: öffnet die Uhr-App mit vorausgefüllter Weckzeit
function alarmHref(time, msg){
  const d=new Date(time);
  return `intent:#Intent;action=android.intent.action.SET_ALARM;i.android.intent.extra.alarm.HOUR=${d.getHours()};i.android.intent.extra.alarm.MINUTES=${d.getMinutes()};S.android.intent.extra.alarm.MESSAGE=${encodeURIComponent(msg)};B.android.intent.extra.alarm.SKIP_UI=true;end`;
}
function renderAlarms(){
  const el=$("alarms"), r=S.running;
  if(!r){ el.hidden=true; $("warnbar").hidden=true; return; }
  const {soll,max,T}=remaining(); const now=Date.now(); const out=[];
  if(soll!=null && soll>LEAD){ const t=now+soll-LEAD; out.push(`<a href="${alarmHref(t,"Stempeluhr: noch 15 Min bis "+fmtHM(T)+" h")}">⏰ Wecker ${fmtHM(T)} h <span class="num">${hm(t)}</span></a>`); }
  if(max>LEAD){ const t=now+max-LEAD; out.push(`<a href="${alarmHref(t,"Stempeluhr: noch 15 Min bis 10 Stunden")}">⏰ Wecker 10 h <span class="num">${hm(t)}</span></a>`); }
  if(notifyPerm()==="default") out.push(`<button class="bell" id="bNotify">🔔 Benachrichtigungen erlauben</button>`);
  el.innerHTML=out.join(""); el.hidden=!out.length;
}

function renderReport(){
  document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-selected", b.dataset.v===UI.view));
  const [a,b]=range();
  const today=sod(new Date());
  // title
  let title;
  if(UI.view==="day") title = (+a===+today?"Heute, ":"") + `${WDL[a.getDay()]} ${a.getDate()}. ${MON[a.getMonth()].slice(0,3)}.`;
  else if(UI.view==="week"){ const e=addDays(b,-1); title=`KW ${isoWeek(a)} · ${a.getDate()}.${pad(a.getMonth()+1)}.–${e.getDate()}.${pad(e.getMonth()+1)}.`; }
  else title=`${MON[a.getMonth()]} ${a.getFullYear()}`;
  $("ptitle").textContent=title;

  const list=entriesIn(a,b);
  const live=liveEntry(); if(live && live.start>=+a && live.start<+b) list.push(live);
  const total=list.reduce((s,e)=>s+net(e),0);
  $("tot").textContent=fmtHM(total)+" h";
  const per={}; for(const e of list) per[e.job]=(per[e.job]||0)+net(e);
  const money=Object.entries(per).reduce((s,[j,ms])=>s+(jobById(j).rate||0)*ms/3600000,0);
  const workdays=new Set(list.map(e=>dayKey(new Date(e.start)))).size;
  $("totside").innerHTML=`${fmtDec(total)} h dezimal${UI.view!=="day"&&workdays?`<br>${workdays} ${workdays===1?"Tag":"Tage"} · Ø ${fmtHM(total/workdays)} h`:""}${money>0?`<br><b>${eur(money)}</b> Verdienst`:""}`;

  // by job
  const max=Math.max(1,...Object.values(per));
  const jobs=Object.keys(per).sort((x,y)=>per[y]-per[x]);
  $("byjob").innerHTML = jobs.length>1 || (jobs.length===1) ? jobs.map(id=>{ const j=jobById(id); const r=j.rate?` <small>${eur(j.rate*per[id]/3600000)}</small>`:""; return `<div class="jrow"><div class="n"><span class="dot" style="background:${jc(j)}"></span><span>${esc(j.name)}</span></div><div class="v">${fmtHM(per[id])} h${r}</div><div class="bar"><i style="width:${per[id]/max*100}%;background:${jc(j)}"></i></div></div>`; }).join("") : "";
  $("byjob").hidden = !jobs.length;

  // Soll / Ist / Saldo für Jobs mit Wochensoll
  const tj=S.jobs.filter(j=>j.target>0);
  const containsToday = +today>=+a && +today<+b, past = +b<=+today;
  $("soll").innerHTML = tj.map(j=>{
    const soll=targetIn(j,a,b,false), ist=per[j.id]||0;
    if(!soll) return "";
    const sollBis = containsToday ? targetIn(j,a,b,true) : (past?soll:0);
    const saldo = ist - sollBis;
    const lbl = containsToday ? "Saldo inkl. heute" : past ? "Saldo" : "Saldo";
    return `<div class="sollrow"><div class="h"><span class="dot" style="background:${jc(j)}"></span>${esc(j.name)} · ${String(j.target).replace(".",",")} h/Woche</div>
      <div><div class="k">Soll</div><div class="v">${fmtHM(soll)}</div></div>
      <div><div class="k">Ist</div><div class="v">${fmtHM(ist)}</div></div>
      <div><div class="k">${lbl}</div><div class="v ${saldo>=0?"pos":"neg"}">${sollBis||past||containsToday?signed(saldo):"–"}</div></div></div>`;
  }).join("") + (tj.length && UI.view==="month" ? `<div class="hint">Soll ohne Feiertage, Urlaub und Krankheit gerechnet.</div>` : "");

  // chart (week / month)
  const ch=$("chart");
  if(UI.view==="day"){ ch.hidden=true; }
  else {
    ch.hidden=false;
    const days=[]; for(let d=new Date(a); d<b; d=addDays(d,1)) days.push(d);
    const byDay=days.map(d=>{ const k=dayKey(d); const m={}; for(const e of list) if(dayKey(new Date(e.start))===k) m[e.job]=(m[e.job]||0)+net(e); return m; });
    const dmax=Math.max(...byDay.map(m=>Object.values(m).reduce((s,v)=>s+v,0)));
    const hrs=Math.max(4, Math.ceil(dmax/3600000/2)*2);
    const lines=[]; for(let h=2; h<=hrs; h+=(hrs>8?4:2)) lines.push(h);
    ch.innerHTML = `<div class="plot"><div class="grid">${lines.map(h=>`<div style="bottom:${h/hrs*100}%"><span>${h}h</span></div>`).join("")}</div>${
      byDay.map((m,i)=>`<div class="col ${+days[i]===+today?"today":""}" title="${dayKey(days[i])}">${S.jobs.concat(Object.keys(m).filter(id=>!S.jobs.find(j=>j.id===id)).map(jobById)).filter(j=>m[j.id]).map(j=>`<i style="height:${m[j.id]/3600000/hrs*100}%;background:${jc(j)}"></i>`).join("")}</div>`).join("")
    }</div><div class="xl">${days.map((d,i)=>`<span>${UI.view==="week"?WD[d.getDay()]:(d.getDate()===1||d.getDate()%5===0?d.getDate():"")}</span>`).join("")}</div>`;
  }

  // entries grouped by day, newest first
  const groups={}; for(const e of list){ const k=dayKey(new Date(e.start)); (groups[k] ||= []).push(e); }
  const keys=Object.keys(groups).sort().reverse();
  if(!keys.length){
    $("days").innerHTML=`<div class="empty">Noch keine Zeiten in diesem Zeitraum.<br>Tippe oben auf <b>Start</b> oder trage eine Zeit mit <b>+ Nachtragen</b> nach.</div>`;
    return;
  }
  $("days").innerHTML = keys.map(k=>{
    const d=new Date(groups[k][0].start); const sum=groups[k].reduce((s,e)=>s+net(e),0);
    return `<div class="day"><h3><span>${WD[d.getDay()]}, ${d.getDate()}. ${MON[d.getMonth()].slice(0,3)}.</span><span class="num">${fmtHM(sum)} h</span></h3>${
      groups[k].map(e=>{ const j=jobById(e.job); const ep=ePause(e); const meta=[ep>=60000?`Pause ${fmtHM(ep)}`:"", e.live?"läuft gerade":"", e.note?esc(e.note):""].filter(Boolean).join(" · ");
        return `<button class="entry ${e.live?"live":""}" data-entry="${esc(e.id)}"><span class="t">${hm(e.start)}–${e.live?"jetzt":hm(e.end)}</span><span class="j"><span class="dot" style="display:inline-block;margin-right:6px;background:${jc(j)}"></span>${esc(j.name)}</span><span class="d">${fmtHM(net(e))}</span>${meta?`<span class="meta">${meta}</span>`:""}</button>`; }).join("")
    }</div>`;
  }).join("");
}

/* ---------- sheets ---------- */
function openSheet(html, onMount){
  const root=$("sheetRoot");
  root.innerHTML=`<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  $("scrim").addEventListener("click",ev=>{ if(ev.target.id==="scrim") closeSheet(); });
  onMount && onMount(root.querySelector(".sheet"));
  const f=root.querySelector("input,select,button"); f && f.focus({preventScroll:true});
}
function closeSheet(){ $("sheetRoot").innerHTML=""; }
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeSheet(); });

function findEntry(id){ for(const k in S.months){ const i=S.months[k].findIndex(e=>e.id===id); if(i>=0) return {k,i,e:S.months[k][i]}; } return null; }

function entrySheet(id){
  const found = id ? findEntry(id) : null;
  const e = found ? found.e : null;
  const base = e ? new Date(e.start) : (UI.view==="day" ? UI.anchor : new Date());
  const st = e ? hm(e.start) : "08:00", en = e ? hm(e.end) : "16:30";
  const pm = e ? Math.round((e.pause||0)/60000) : 30;
  openSheet(`
    <h2>${e?"Eintrag bearbeiten":"Zeit nachtragen"}</h2>
    <div class="field"><label for="fJob">Job</label><select id="fJob">${S.jobs.map(j=>`<option value="${esc(j.id)}" ${(e?e.job:S.sel)===j.id?"selected":""}>${esc(j.name)}</option>`).join("")}${e&&!S.jobs.find(j=>j.id===e.job)?`<option value="${esc(e.job)}" selected>Gelöschter Job</option>`:""}</select></div>
    <div class="field"><label for="fDate">Datum</label><input type="date" id="fDate" value="${dayKey(base)}"></div>
    <div class="row3">
      <div class="field"><label for="fStart">Beginn</label><input type="time" id="fStart" value="${st}"></div>
      <div class="field"><label for="fEnd">Ende</label><input type="time" id="fEnd" value="${en}"></div>
      <div class="field"><label for="fPause">Pause min</label><input type="number" id="fPause" min="0" step="5" inputmode="numeric" value="${pm}"></div>
    </div>
    <div class="field"><label for="fNote">Notiz</label><input id="fNote" maxlength="140" value="${esc(e?.note||"")}"></div>
    <div class="hint" id="fCalc"></div>
    <div class="err" id="fErr"></div>
    <div class="sheet-actions">
      ${e?`<button class="sbtn danger" id="fDel">Löschen</button>`:""}
      <button class="sbtn" id="fCancel">Abbrechen</button>
      <button class="sbtn primary" id="fSave">Speichern</button>
    </div>`, sh=>{
      const calc=()=>{ const r=readForm(); $("fCalc").textContent = r.err ? "" : `Arbeitszeit: ${fmtHM(net(r))} h (${fmtDec(net(r))} h)${r.end-r.start>0 && new Date(r.end).getDate()!==new Date(r.start).getDate()?" · endet am Folgetag":""}`; };
      sh.addEventListener("input",calc); calc();
      $("fCancel").onclick=closeSheet;
      $("fSave").onclick=()=>{
        const r=readForm(); if(r.err){ $("fErr").textContent=r.err; return; }
        const k=monKey(new Date(r.start));
        if(found){ S.months[found.k].splice(found.i,1); if(found.k!==k) saveMonth(found.k); }
        (S.months[k] ||= []).push({id:e?e.id:uid(), job:r.job, start:r.start, end:r.end, pause:r.pause, note:r.note});
        saveMonth(k); closeSheet(); render(); toast(e?"Gespeichert":"Eintrag hinzugefügt");
      };
      if(e) $("fDel").onclick=ev=>{
        const b=ev.currentTarget;
        if(!b.classList.contains("armed")){ b.classList.add("armed"); b.textContent="Wirklich löschen?"; return; }
        S.months[found.k].splice(found.i,1); saveMonth(found.k); closeSheet(); render(); toast("Eintrag gelöscht");
      };
  });
}
function readForm(){
  const d=$("fDate").value, s=$("fStart").value, en=$("fEnd").value;
  if(!d||!s||!en) return {err:"Bitte Datum, Beginn und Ende ausfüllen."};
  const [Y,M,D]=d.split("-").map(Number), [sh,sm]=s.split(":").map(Number), [eh,em]=en.split(":").map(Number);
  const start=new Date(Y,M-1,D,sh,sm).getTime(); let end=new Date(Y,M-1,D,eh,em).getTime();
  if(end<=start) end+=86400000; // über Mitternacht
  const pause=Math.max(0,(parseInt($("fPause").value,10)||0))*60000;
  if(pause>=end-start) return {err:"Die Pause ist länger als die Arbeitszeit."};
  if(end-start>24*3600000) return {err:"Ein Eintrag kann höchstens 24 Stunden lang sein."};
  return {job:$("fJob").value, start, end, pause, note:$("fNote").value.trim()};
}

function liveSheet(){
  const r=S.running;
  openSheet(`<h2>Laufende Zeit</h2>
    <div class="field"><label for="lStart">Beginn korrigieren</label><input type="time" id="lStart" value="${hm(r.start)}"></div>
    <div class="hint">Praktisch, wenn du vergessen hast, rechtzeitig einzustempeln.</div>
    <div class="err" id="lErr"></div>
    <div class="sheet-actions"><button class="sbtn danger" id="lDiscard">Verwerfen</button><button class="sbtn" id="lCancel">Abbrechen</button><button class="sbtn primary" id="lSave">Speichern</button></div>`, ()=>{
      $("lCancel").onclick=closeSheet;
      $("lSave").onclick=()=>{
        const [h,m]=$("lStart").value.split(":").map(Number); const d=new Date(r.start); d.setHours(h,m,0,0);
        if(d.getTime()>Date.now()) d.setDate(d.getDate()-1);
        if(Date.now()-d.getTime()>24*3600000){ $("lErr").textContent="Beginn liegt zu weit zurück."; return; }
        r.start=d.getTime(); r.notified={}; saveSettings(); closeSheet(); render(); toast("Beginn angepasst");
      };
      $("lDiscard").onclick=ev=>{ const b=ev.currentTarget; if(!b.classList.contains("armed")){ b.classList.add("armed"); b.textContent="Wirklich verwerfen?"; return; }
        S.running=null; $("note").value=""; saveSettings(); closeSheet(); render(); toast("Laufende Zeit verworfen"); };
  });
}

function jobsSheet(){
  let draft=S.jobs.map(j=>({...j}));
  const rows=()=>draft.map((j,i)=>`<div class="jobcard jobedit" data-i="${i}">
      <div class="r1">
        <button class="swatch" data-act="color" aria-label="Farbe ändern" style="background:${jc(j)}"></button>
        <input type="text" id="jn${i}" data-k="name" value="${esc(j.name)}" maxlength="30" aria-label="Name" placeholder="Name">
        <button class="iconbtn" data-act="del" aria-label="Job entfernen" ${draft.length<=1?"disabled":""}>✕</button>
      </div>
      <div class="r2">
        <label class="mini">€ pro Stunde<input id="jr${i}" data-k="rate" type="number" min="0" step="0.5" inputmode="decimal" value="${j.rate||""}" placeholder="optional"></label>
        <label class="mini">Soll h/Woche<input id="jt${i}" data-k="target" type="number" min="0" max="80" step="0.5" inputmode="decimal" value="${j.target||""}" placeholder="kein Soll"></label>
      </div>
    </div>`).join("");
  openSheet(`<h2>Jobs</h2>
    <div class="hint">Farbkreis antippen zum Wechseln. Das Soll wird auf Mo–Fr verteilt (41 h = 8:12 pro Tag).</div>
    <div id="jl" style="display:flex;flex-direction:column;gap:10px">${rows()}</div>
    <button class="sbtn" id="jAdd">+ Job hinzufügen</button>
    <div class="err" id="jErr"></div>
    <div class="sheet-actions"><button class="sbtn" id="jCancel">Abbrechen</button><button class="sbtn primary" id="jSave">Speichern</button></div>`, sh=>{
      const jl=$("jl"); const redraw=()=>{ jl.innerHTML=rows(); };
      jl.addEventListener("input",ev=>{ const i=+ev.target.closest(".jobedit").dataset.i; const k=ev.target.dataset.k; if(k==="name") draft[i].name=ev.target.value; if(k==="rate") draft[i].rate=parseFloat(String(ev.target.value).replace(",","."))||0; if(k==="target") draft[i].target=Math.min(80,parseFloat(String(ev.target.value).replace(",","."))||0); });
      jl.addEventListener("click",ev=>{ const b=ev.target.closest("button"); if(!b) return; const i=+b.closest(".jobedit").dataset.i;
        if(b.dataset.act==="color"){ draft[i].color=((draft[i].color||0)+1)%COLORS; b.style.background=jc(draft[i]); }
        if(b.dataset.act==="del"){ draft.splice(i,1); redraw(); } });
      $("jAdd").onclick=()=>{ draft.push({id:"j_"+uid(), name:"", color:draft.length%COLORS, rate:0, target:0}); redraw(); jl.querySelector(".jobedit:last-child input[data-k=name]").focus(); };
      $("jCancel").onclick=closeSheet;
      $("jSave").onclick=()=>{
        draft=draft.map(j=>({...j,name:j.name.trim()})).filter(j=>j.name);
        if(!draft.length){ $("jErr").textContent="Lege mindestens einen Job an."; return; }
        if(S.running && !draft.find(j=>j.id===S.running.job)){ $("jErr").textContent="Der Job, der gerade läuft, kann nicht entfernt werden."; return; }
        S.jobs=draft; if(!S.jobs.find(j=>j.id===S.sel)) S.sel=S.jobs[0].id;
        saveSettings(); closeSheet(); render(); toast("Jobs gespeichert");
      };
  });
}

function buildCsv(list){
  const n=v=>v.toLocaleString("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2});
  const q=s=>`"${String(s??"").replace(/"/g,'""')}"`;
  const rows=[["Datum","Wochentag","Job","Beginn","Ende","Pause (min)","Arbeitszeit (h:mm)","Arbeitszeit (dezimal)","Stundenlohn (€)","Verdienst (€)","Notiz"]];
  for(const e of list){ const d=new Date(e.start), j=jobById(e.job), h=net(e)/3600000;
    rows.push([`${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()}`, WDL[d.getDay()], j.name, hm(e.start), hm(e.end), Math.round(ePause(e)/60000), fmtHM(net(e)), n(h), j.rate?n(j.rate):"", j.rate?n(j.rate*h):"", e.note||""]); }
  const tot=list.reduce((s,e)=>s+net(e),0);
  rows.push(["Summe","","","","","",fmtHM(tot),n(tot/3600000),"",n(list.reduce((s,e)=>s+(jobById(e.job).rate||0)*net(e)/3600000,0)),""]);
  return "﻿"+rows.map(r=>r.map(q).join(";")).join("\r\n");
}
async function exportCsv(){
  const [a,b]=range(); const list=entriesIn(a,b);
  if(!list.length){ toast("Keine abgeschlossenen Einträge in diesem Zeitraum."); return; }
  const tag = UI.view==="day"?dayKey(a):UI.view==="week"?`${a.getFullYear()}-KW${pad(isoWeek(a))}`:monKey(a);
  const csv=buildCsv(list), name=`Zeiterfassung_${tag}.csv`;
  try{
    const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
    const file=new File([blob],name,{type:"text/csv"});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:name}); return; }
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000); toast("Export gespeichert");
  }catch(err){ if(err && err.name==="AbortError") return; toast("Export fehlgeschlagen"); }
}

/* ---------- events ---------- */
document.addEventListener("click",ev=>{
  const t=ev.target.closest("button"); if(!t) return;
  if(t.id==="bStart") start();
  else if(t.id==="bStop") stop();
  else if(t.id==="bPause") togglePause();
  else if(t.id==="bNotify") askNotify();
  else if(t.dataset.job && !S.running){ S.sel=t.dataset.job; renderClock(); try{ lsSave(); }catch(e){} }
  else if(t.dataset.entry){ t.dataset.entry==="live" ? liveSheet() : entrySheet(t.dataset.entry); }
  else if(t.dataset.v){ UI.view=t.dataset.v; renderReport(); try{ localStorage.setItem(LS+".view",UI.view); }catch(e){} }
  else if(t.id==="prev"||t.id==="next"){ const s=t.id==="prev"?-1:1; const a=UI.anchor;
    UI.anchor = UI.view==="day"?addDays(a,s):UI.view==="week"?addDays(a,7*s):new Date(a.getFullYear(),a.getMonth()+s,1); renderReport(); }
  else if(t.id==="btnAdd") entrySheet(null);
  else if(t.id==="btnJobs") jobsSheet();
  else if(t.id==="btnExport") exportCsv();
});
$("ptitle").addEventListener("click",()=>{ UI.anchor=new Date(); renderReport(); });
let noteT; $("note").addEventListener("input",()=>{ if(!S.running) return; clearTimeout(noteT); noteT=setTimeout(()=>{ S.running.note=$("note").value.trim(); saveSettings(); },800); });

try{ const v=localStorage.getItem(LS+".view"); if(v) UI.view=v; }catch(e){}
setInterval(()=>{ tick(); },1000);
setInterval(()=>{ if(S.running){ renderReport(); renderAlarms(); } },30000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) render(); });
initStore();
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
})();
</script>
